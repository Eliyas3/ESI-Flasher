<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Filter for subtle crisp glow -->
    <filter id="esiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0066ff" flood-opacity="0.3" />
    </filter>

    <!-- Gradients for realistic 3D isometric shading -->
    <linearGradient id="blueFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0052cc" />
    </linearGradient>

    <linearGradient id="blueTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="blueSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f2b6e" />
    </linearGradient>

    <linearGradient id="greyFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="greyTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="greySide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="silverDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <g id="esi-mark" stroke-linecap="round" stroke-linejoin="round">
    <!-- ==================== 'E' COMPONENT (LEFT) ==================== -->
    <!-- E - Dark Front Face -->
    <path d="M 64 140 
             L 230 44 
             L 230 110 
             L 118 174 
             L 118 226 
             L 220 285 
             L 220 338 
             L 118 280 
             L 118 340 
             L 230 404 
             L 230 468 
             L 64 372 Z"
          fill="url(#greyFront)" 
          stroke="#ffffff" 
          stroke-width="9" />

    <!-- E - 3D Top Bevels / Extrusion Facets -->
    <path d="M 64 140 L 118 174 L 230 110 L 176 78 Z" 
          fill="url(#greyTop)" 
          stroke="#ffffff" 
          stroke-width="7" />
    
    <path d="M 118 226 L 158 249 L 230 208 L 220 285 Z" 
          fill="url(#greyTop)" 
          stroke="#ffffff" 
          stroke-width="5" />

    <path d="M 64 372 L 118 340 L 176 374 L 118 404 Z" 
          fill="url(#greyTop)" 
          stroke="#ffffff" 
          stroke-width="5" />

    <!-- ==================== 'S' COMPONENT (BLUE CENTER SPINE) ==================== -->
    <!-- S - Central 3D Flow -->
    <!-- Upper vertical stem and top curve of S -->
    <path d="M 236 40 
             L 256 28 
             L 420 122 
             L 420 178 
             L 300 110 
             L 300 240 
             L 450 326 
             L 450 380 
             L 256 492 
             L 236 480 
             L 236 414 
             L 396 322 
             L 396 292 
             L 246 206 
             L 246 104 
             L 236 98 Z" 
          fill="url(#blueFront)" 
          stroke="#ffffff" 
          stroke-width="9" 
          filter="url(#esiGlow)" />

    <!-- S - 3D Top Lighting Facets -->
    <path d="M 236 40 L 256 28 L 420 122 L 396 136 L 256 56 Z" 
          fill="url(#blueTop)" 
          stroke="#ffffff" 
          stroke-width="7" />

    <path d="M 246 206 L 300 240 L 450 326 L 396 322 Z" 
          fill="url(#blueTop)" 
          stroke="#ffffff" 
          stroke-width="7" />

    <path d="M 236 480 L 256 492 L 450 380 L 420 362 L 256 458 Z" 
          fill="url(#blueSide)" 
          stroke="#ffffff" 
          stroke-width="7" />

    <!-- S - Vertical Blue Pillar Extrusion -->
    <path d="M 246 104 L 300 110 L 300 240 L 246 206 Z" 
          fill="url(#blueSide)" 
          stroke="#ffffff" 
          stroke-width="7" />

    <!-- ==================== 'i' COMPONENT (RIGHT) ==================== -->
    <!-- Dot of the 'i' (Isometric tilted oval/disc) -->
    <g transform="translate(436, 172) rotate(-28)">
      <ellipse cx="0" cy="0" rx="22" ry="34" 
               fill="url(#silverDot)" 
               stroke="#ffffff" 
               stroke-width="8" />
      <ellipse cx="-4" cy="-5" rx="14" ry="24" 
               fill="#cbd5e1" 
               opacity="0.8" />
    </g>

    <!-- Stem of the 'i' (Right vertical column) -->
    <path d="M 408 214 
             L 458 242 
             L 458 350 
             L 408 322 Z" 
          fill="url(#greyFront)" 
          stroke="#ffffff" 
          stroke-width="9" />

    <!-- Top facet of 'i' stem -->
    <path d="M 408 214 L 436 198 L 486 226 L 458 242 Z" 
          fill="url(#greyTop)" 
          stroke="#ffffff" 
          stroke-width="6" />

    <!-- Right 3D shadow face of 'i' stem -->
    <path d="M 458 242 L 486 226 L 486 334 L 458 350 Z" 
          fill="url(#greySide)" 
          stroke="#ffffff" 
          stroke-width="7" />
  </g>
</svg>
